<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Minimal fontconfig for the node-canvas bundled fontconfig, which cannot parse
  some newer directives in the system /etc/fonts/conf.d and prints dozens of
  warnings on every start. main.ts points FONTCONFIG_FILE here for the worker.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
